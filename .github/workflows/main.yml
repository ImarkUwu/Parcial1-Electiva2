
#Config del main.yml
name: Deploy a Surge

on:
  push:
    branches:
      - main

jobs:
 deploy:
    runs-on: ubuntu24.04 #lastest ubuntu estaba dando un error asi que intente cambiar de version
    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Instalar Surge
        run: npm install -g surge

      - name: Desplegar en Surge
        run: surge ./ Gian-Perez-20251142.surge.sh --token ${{ secrets.SURGE_TOKEN }}
